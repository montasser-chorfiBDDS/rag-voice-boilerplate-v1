services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rag-app:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./main.py:/app/main.py
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://localhost:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    image: rag-app:latest
    depends_on:
      - backend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./app_ui.py:/app/app_ui.py
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000
    command: streamlit run app_ui.py --server.port 8501
    restart: unless-stopped
